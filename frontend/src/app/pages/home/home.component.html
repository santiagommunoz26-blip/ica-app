<mat-toolbar color="primary">
  <mat-icon class="mr-2">flutter_dash</mat-icon>
  <span class="font-semibold">Aplicativo EBA Aves</span>
  <span class="grow"></span>
  <span class="text-sm">{{ etapa }}</span>
</mat-toolbar>

<main class="mx-auto flex w-full max-w-3xl flex-col gap-6 p-6">
  <mat-card appearance="outlined" class="rounded-xl">
    <mat-card-content class="flex flex-col gap-3 p-6">
      <h1 class="text-3xl font-bold text-slate-900">{{ titulo }}</h1>
      <p class="text-base leading-relaxed text-slate-700">
        {{ descripcion }}
      </p>
      <p class="text-sm text-slate-500">{{ stack }}</p>
    </mat-card-content>
    <mat-card-actions align="end" class="px-6 pb-4">
      <button mat-flat-button color="primary" disabled>
        <mat-icon>construction</mat-icon>
        Módulos en construcción
      </button>
    </mat-card-actions>
  </mat-card>
</main>
