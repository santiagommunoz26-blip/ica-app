<div class="flex w-full flex-col gap-3" role="status" aria-busy="true">
  <span class="sr-only">Cargando…</span>

  @switch (forma()) {
    @case ('tarjeta') {
      <div class="esqueleto h-24 w-full rounded-tarjeta"></div>
      <div class="flex flex-col gap-2">
        @for (indice of indices(); track indice) {
          <div class="esqueleto h-4 rounded-full" [class]="ancho(indice)"></div>
        }
      </div>
    }
    @case ('tabla') {
      <div class="esqueleto h-10 w-full rounded-md"></div>
      @for (indice of indices(); track indice) {
        <div class="esqueleto h-12 w-full rounded-md"></div>
      }
    }
    @default {
      @for (indice of indices(); track indice) {
        <div class="esqueleto h-4 rounded-full" [class]="ancho(indice)"></div>
      }
    }
  }
</div>
