<div class="relative h-64 w-full">
  @if (hayDatos()) {
    <canvas
      #lienzo
      role="img"
      [attr.aria-label]="titulo() || 'Gráfica de datos'"
    ></canvas>

    @if (textoCentro()) {
      <div
        class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center"
      >
        <span class="text-2xl font-bold text-contenido">{{
          textoCentro()
        }}</span>
      </div>
    }
  } @else {
    <div class="flex h-full items-center justify-center">
      <app-estado-vacio
        icono="bar_chart"
        titulo="Sin datos todavía"
        [descripcion]="vacio()"
      />
    </div>
  }
</div>
