# Infraestructura de desarrollo local.
#
# Credenciales: los valores por defecto son SOLO para desarrollo local.
# En producción se usan los servicios gestionados de Google Cloud
# (Cloud SQL, Cloud Storage, Firebase). Copia .env.example a .env para cambiarlos.

name: ica-app

services:
  postgres:
    image: postgres:16-alpine
    container_name: ica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ica}
      POSTGRES_DB: ${POSTGRES_DB:-ica}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ica} -d ${POSTGRES_DB:-ica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ica-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: ica-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
